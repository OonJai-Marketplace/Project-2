  function trapFocus(modalEl) {
    const focusableEls = modalEl.querySelectorAll('a[href], button, textarea, input, select');
    if(focusableEls.length === 0) return;
    const first = focusableEls[0], last = focusableEls[focusableEls.length - 1];

    if (modalEl._keyListener) {
      modalEl.removeEventListener('keydown', modalEl._keyListener);
    }

    modalEl._keyListener = function(e) {
      if (e.key !== 'Tab') return;
      if (e.shiftKey) { if (document.activeElement === first) { last.focus(); e.preventDefault(); } } 
      else { if (document.activeElement === last) { first.focus(); e.preventDefault(); } }
    };

    modalEl.addEventListener('keydown', modalEl._keyListener);
    setTimeout(() => first.focus(), 50);
  }

  // --- FLYING ANIMATION TO FLOATING CART ---
  function animateFlyToCart(originElement) {
    const cartBtn = document.getElementById('floatingCartBtn');
    if (!cartBtn) return;

    let startX = window.innerWidth / 2;
    let startY = window.innerHeight / 2;

    if (originElement) {
      const rect = originElement.getBoundingClientRect();
      if (rect.width > 0 && (rect.top !== 0 || rect.left !== 0)) {
        startX = rect.left + rect.width / 2;
        startY = rect.top + rect.height / 2;
      }
    }

    const cartRect = cartBtn.getBoundingClientRect();
    const endX = cartRect.left + cartRect.width / 2;
    const endY = cartRect.top + cartRect.height / 2;

    const particle = document.createElement('div');
    particle.className = 'flying-cart-item';
    particle.style.left = startX + 'px';
    particle.style.top = startY + 'px';
    document.body.appendChild(particle);

    requestAnimationFrame(() => {
      particle.style.left = endX + 'px';
      particle.style.top = endY + 'px';
      particle.style.transform = 'translate(-50%, -50%) scale(0.3)';
      particle.style.opacity = '0.4';
    });

    setTimeout(() => {
      particle.remove();
      cartBtn.classList.remove('cart-shake');
      void cartBtn.offsetWidth;
      cartBtn.classList.add('cart-shake');
      setTimeout(() => cartBtn.classList.remove('cart-shake'), 600);
    }, 750);
  }

  function setupFloatingCartObserver() {
    const cartSection = document.getElementById('cartSection');
    const floatingBtn = document.getElementById('floatingCartBtn');
    if (!cartSection || !floatingBtn) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const isMenuTabActive = document.getElementById('tab-menu').classList.contains('active');
        if (entry.isIntersecting || !isMenuTabActive) {
          floatingBtn.classList.add('hidden');
        } else {
          floatingBtn.classList.remove('hidden');
        }
      });
    }, { threshold: 0.1 });

    observer.observe(cartSection);
  }

  // --- ADJUSTED (STRICTER) SWIPE LOGIC ---
  function setupTabSwiping() {
    const appRoot = document.getElementById('appRoot');
    appRoot.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});

    appRoot.addEventListener('touchend', e => {
      if (e.target.closest('.carousel-container') || e.target.closest('.home-card-slider') || e.target.closest('.modal-overlay.active')) return;
      
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      const absX = Math.abs(diffX);
      const absY = Math.abs(diffY);
      
      // Strict threshold: Must be a very deliberate horizontal swipe
      if (absX > 80 && absX > absY * 2.5) {
        const currentTab = document.querySelector('.nav-tab.active').dataset.tab;
        let idx = mainTabs.indexOf(currentTab);
        if (diffX < 0 && idx < mainTabs.length - 1) { 
          App.switchMainTab(mainTabs[idx + 1]);
        } else if (diffX > 0 && idx > 0) { 
          App.switchMainTab(mainTabs[idx - 1]);
        }
      }
    }, {passive: true});
  }

  function makeScrollableDraggable(ele, trackId, isVertical = false) {
    if (ele.dataset.dragAttached) return;
    let pos = { top: 0, left: 0, x: 0, y: 0 }, isDragging = false;
    const mouseDownHandler = (e) => {
      isDragging = true; ele.style.cursor = 'grabbing'; ele.style.userSelect = 'none';
      pos = { left: ele.scrollLeft, top: ele.scrollTop, x: e.clientX, y: e.clientY };
      document.addEventListener('mousemove', mouseMoveHandler);
      document.addEventListener('mouseup', mouseUpHandler);
      if (carouselIntervals[trackId]) clearInterval(carouselIntervals[trackId]); 
    };
    const mouseMoveHandler = (e) => {
      if (!isDragging) return;
      if (isVertical) ele.scrollTop = pos.top - (e.clientY - pos.y);
      else ele.scrollLeft = pos.left - (e.clientX - pos.x);
    };
    const mouseUpHandler = () => {
      isDragging = false; ele.style.cursor = 'grab'; ele.style.removeProperty('user-select');
      document.removeEventListener('mousemove', mouseMoveHandler);
      document.removeEventListener('mouseup', mouseUpHandler);
      if(trackId && !isVertical) startAutoPlay(trackId, 4000); 
    };
    ele.addEventListener('mousedown', mouseDownHandler);
    ele.style.cursor = 'grab';
    ele.addEventListener('touchstart', () => { if (carouselIntervals[trackId]) clearInterval(carouselIntervals[trackId]); }, {passive: true});
    ele.addEventListener('touchend', () => { if(trackId && !isVertical) startAutoPlay(trackId, 4000); }, {passive: true});
    ele.dataset.dragAttached = 'true';
  }

  function startAutoPlay(trackId, intervalMs) {
    clearInterval(carouselIntervals[trackId]);
    carouselIntervals[trackId] = setInterval(() => {
      const track = document.getElementById(trackId);
      if(!track || track.clientWidth === 0) return; 
      track.scrollBy({ left: track.clientWidth, behavior: 'smooth' }); 
    }, intervalMs);
  }

  function setupCarousel(trackId, dotsId, imagesArray) {
    const track = document.getElementById(trackId), dots = document.getElementById(dotsId);
    const validImages = (imagesArray || []).filter(link => link && link.trim() !== "");
    if (validImages.length === 0) return;

    if (carouselIntervals[trackId]) clearInterval(carouselIntervals[trackId]);

    if (validImages.length === 1) {
      track.innerHTML = `<img src="${validImages[0]}" class="carousel-img" draggable="false" loading="eager"/>`;
      dots.innerHTML = '';
      track.onscroll = null;
      return;
    }

    let html = '', dotsHtml = '';
    html += `<img src="${validImages[validImages.length - 1]}" class="carousel-img clone" draggable="false" loading="eager"/>`;
    validImages.forEach((imgLink, i) => {
      html += `<img src="${imgLink}" class="carousel-img" draggable="false" loading="lazy"/>`;
      dotsHtml += `<span class="dot" onclick="App.goToSlide('${trackId}', ${i + 1})"></span>`;
    });
    html += `<img src="${validImages[0]}" class="carousel-img clone" draggable="false" loading="lazy"/>`;
    
    track.innerHTML = html; 
    dots.innerHTML = dotsHtml;
    
    track.classList.add('no-smooth');
    track.scrollLeft = track.clientWidth;
    void track.offsetWidth;
    track.classList.remove('no-smooth');

    track.onscroll = () => {
      if (track.clientWidth === 0) return;
      const maxScroll = track.scrollWidth - track.clientWidth;
      
      if (track.scrollLeft <= 1) {
        track.classList.add('no-smooth');
        track.scrollLeft = maxScroll - track.clientWidth; 
        track.classList.remove('no-smooth');
      } 
      else if (track.scrollLeft >= maxScroll - 1) { 
        track.classList.add('no-smooth');
        track.scrollLeft = track.clientWidth; 
        track.classList.remove('no-smooth');
      }

      let index = Math.round(track.scrollLeft / track.clientWidth) - 1;
      if (index < 0) index = validImages.length - 1;
      if (index >= validImages.length) index = 0;
      
      const dotElements = document.querySelectorAll(`#${dotsId} .dot`);
      if(dotElements.length > 0) {
        dotElements.forEach((d, i) => d.classList.toggle('active', i === index));
      }
    };

    makeScrollableDraggable(track, trackId, false);
    if (document.querySelector(`#${dotsId} .dot`)) document.querySelector(`#${dotsId} .dot`).classList.add('active');
    startAutoPlay(trackId, 4000); 
  }

    container.addEventListener('mouseenter', () => isVerticalHoveredOrDragged = true);
    container.addEventListener('mouseleave', () => isVerticalHoveredOrDragged = false);
    container.addEventListener('touchstart', () => isVerticalHoveredOrDragged = true, {passive: true});
    container.addEventListener('touchend', () => setTimeout(() => isVerticalHoveredOrDragged = false, 1500), {passive: true});

    clearInterval(verticalScrollInterval);
    verticalScrollInterval = setInterval(() => {
      if (!isVerticalHoveredOrDragged) {
        container.scrollTop += 1;
        if (Math.ceil(container.scrollTop + container.clientHeight) >= container.scrollHeight) container.scrollTop = 0;
      }
    }, 35);
  }

  function initHomeSliders() {
    const createHomeSlider = (containerId, imagesArray, delayOffset) => {
      const container = document.getElementById(containerId);
      if (!container) return;
      const validImages = imagesArray.filter(link => link.trim() !== "");
      if (validImages.length === 0) return;

      container.innerHTML = validImages.map((src, i) => `<img src="${src}" class="${i === 0 ? 'active' : ''}" alt="Home Preview" loading="lazy">`).join('');
      if (validImages.length > 1) {
        let currentIndex = 0;
        const imgs = container.querySelectorAll('img');
        setTimeout(() => setInterval(() => {
            imgs[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % validImages.length;
            imgs[currentIndex].classList.add('active');
        }, 3500), delayOffset);
      }
    };
    createHomeSlider('homeSliderMenu', homeMenuImages, 0);
    createHomeSlider('homeSliderHope', homeHopeImages, 800);
    createHomeSlider('homeSliderReview', homeReviewImages, 1600);
  }

  document.addEventListener('click', function(event) {
    const menu = document.getElementById('mobileMenu'), hamburger = document.querySelector('.hamburger');
    if (menu && hamburger && menu.classList.contains('active') && !menu.contains(event.target) && !hamburger.contains(event.target)) {
      menu.classList.remove('active');
      hamburger.setAttribute('aria-expanded', 'false');
    }
  });

  function setupForm() {
    let deviceToken = localStorage.getItem("oonjai_user_id");
    if (!deviceToken) {
      deviceToken = "DEV-" + Math.random().toString(36).substring(2, 11) + Date.now();
      localStorage.setItem("oonjai_user_id", deviceToken);
    }
    document.getElementById("device_token").value = deviceToken;

    const messageInput = document.getElementById('message');
    const wordCounter = document.getElementById('wordCounter');
    const getWordCount = (str) => { const t = str.trim(); return t ? t.split(/\s+/).length : 0; };

    messageInput.addEventListener('input', function() {
      const count = getWordCount(this.value);
      wordCounter.innerText = `${count} / 20-30 words`;
      wordCounter.style.color = (count >= 20 && count <= 30) ? "#4ade80" : "#64748b";
    });

    document.getElementById('customForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const status = document.getElementById('statusMsg'), submitBtn = document.getElementById('submitBtn');
      const wordCount = getWordCount(messageInput.value);

      if (wordCount < 20 || wordCount > 30) {
        status.style.color = "#f87171";
        status.innerText = `Message is ${wordCount < 20 ? 'too short' : 'too long'} (${wordCount} words). Must be between 20 and 30 words.`;
        return;
      }
      status.style.color = "#94a3b8"; status.innerText = "Submitting..."; submitBtn.disabled = true;

      fetch(WEB_APP_URL, { method: 'POST', body: new FormData(this), mode: 'no-cors' })
      .then(() => {
        status.style.color = "#4ade80"; 
        status.innerText = "✓ Sent successfully!";
        App.triggerAlert("Thank you for sharing your message! 🌱\n\nYour word of hope has been received and may bring joy to someone when they need it most.", "Message Sent! 💌");
        App.clearForm(); 
        submitBtn.disabled = false;
      })
      .catch(() => {
        status.style.color = "#f87171"; 
        status.innerText = "Error submitting message. Please try again.";
        App.triggerAlert("Something went wrong while submitting your message. Please check your connection and try again.", "Error");
        submitBtn.disabled = false;
      });
    });
  }

  function renderProductsGrid() {
    const container = document.getElementById('productsGrid'); container.innerHTML = '';
    menuData[currentCategory].forEach(item => {
      const totalCount = cart.filter(c => c.id === item.id).reduce((acc, curr) => acc + curr.qty, 0);
      
      const card = document.createElement('div'); card.className = 'product-card';
      const countHtml = totalCount > 0 ? `<span class="item-count-text">×${totalCount}</span>` : '';
      const actionBtn = item.isCustom ? `<button class="add-btn" onclick="App.openCustomModal('${currentCategory}', '${item.id}')">Customize</button>`
                                      : `<button class="add-btn" onclick="App.addMenuItemToCart('${currentCategory}', '${item.id}', this)">Add +</button>`;
      
      const thumbnailSrc = item.images && item.images.length > 0 ? item.images[0] : defaultDummyImages[0];
      const imageHtml = `<img src="${thumbnailSrc}" class="product-image" alt="${item.name}" loading="lazy" onclick="App.openGallery('${currentCategory}', '${item.id}')" aria-label="View images and details for ${item.name}">`;

      card.innerHTML = `
        <div style="display: flex; gap: 12px; align-items: center; width: 100%;">
          ${imageHtml}
          <div class="product-info">
            <div class="product-name">${item.name}</div>
            <div class="product-desc">${item.desc}</div>
          </div>
        </div>
        <div class="product-action">
          <span class="price">${formatKip(item.price)}</span>
          <div class="btn-wrapper">${countHtml}${actionBtn}</div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // --- PUBLIC API / METHODS ---
  return {
    startAutoPlay,
    
    toggleMobileMenu: function() { 
      const menu = document.getElementById('mobileMenu');
      const btn = document.querySelector('.hamburger');
      menu.classList.toggle('active');
      btn.setAttribute('aria-expanded', menu.classList.contains('active'));
    },

    switchMainTab: function(tabId) {
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');

      document.querySelectorAll('.nav-tab').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      document.querySelectorAll(`[data-tab="${tabId}"]`).forEach(btn => {
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
      });

      sessionStorage.setItem('oonjai_active_tab', tabId);
      history.replaceState(null, null, '#' + tabId);

      const mobileMenu = document.getElementById('mobileMenu');
      mobileMenu.classList.remove('active');
      document.querySelector('.hamburger').setAttribute('aria-expanded', 'false');
      
      const floatingBtn = document.getElementById('floatingCartBtn');
      if (floatingBtn) {
        if (tabId === 'menu') {
          floatingBtn.classList.remove('hidden');
        } else {
          floatingBtn.classList.add('hidden');
        }
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    scrollToBasket: function() {
      const cartSection = document.getElementById('cartSection');
      if (cartSection) {
        cartSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
        cartSection.classList.remove('basket-highlight');
        void cartSection.offsetWidth;
        cartSection.classList.add('basket-highlight');

        setTimeout(() => {
          cartSection.classList.remove('basket-highlight');
        }, 6000);
      }
    },

    scrollCarousel: function(trackId, dir) {
      const track = document.getElementById(trackId);
      track.scrollBy({ left: track.clientWidth * dir, behavior: 'smooth' });
      startAutoPlay(trackId, 4000); 
    },
    
    goToSlide: function(trackId, slideIndex) {
      const track = document.getElementById(trackId);
      track.scrollTo({ left: track.clientWidth * slideIndex, behavior: 'smooth' });
      startAutoPlay(trackId, 4000);
    },

    clearForm: function() {
      document.getElementById('customForm').reset();
      document.getElementById("device_token").value = localStorage.getItem("oonjai_user_id");
      document.getElementById('statusMsg').innerText = "";
      const wc = document.getElementById('wordCounter');
      wc.innerText = "0 / 20-30 words"; wc.style.color = "#64748b";
    },

    switchCategory: function(catKey) {
      currentCategory = catKey;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.category === catKey));
      const titleMap = { burgers: 'Burgers', sandwiches: 'Sandwiches', texmex: 'Tex-Mexican', pasta: 'Pasta', bowl: 'Build Your Bowl', smoothies: 'Smoothies', refreshers: 'Refreshers', wellness: 'Wellness Drinks' };
      document.getElementById('categoryTitle').innerText = titleMap[catKey];
      
      renderProductsGrid();
      const scrollTarget = window.innerWidth < 768 ? document.getElementById('contentLayout') : document.getElementById('mainContent');
      if (scrollTarget && typeof scrollTarget.scrollIntoView === 'function') scrollTarget.scrollIntoView({behavior: 'smooth', block: 'start'});
    },

    addMenuItemToCart: function(category, itemId, eventElement = null) {
      const item = menuData[category].find(i => i.id === itemId);
      if (item) { 
        const existing = cart.find(c => c.id === item.id && !c.isCustom);
        if (existing) {
          existing.qty += 1;
        } else {
          cart.push({ id: item.id, name: item.name, price: item.price, subtext: '', qty: 1, isCustom: false, category: category });
        }
        
        animateFlyToCart(eventElement);
        this._reRenderStore(); 
      }
    },

    incrementCartItem: function(index) {
      const item = cart[index];
      if (item.isCustom) {
        this.openCustomModal(item.category, item.id);
      } else {
        item.qty += 1;
        this._reRenderStore();
      }
    },

    decrementCartItem: function(index) {
      if (cart[index].qty > 1) {
        cart[index].qty -= 1;
      } else {
        cart.splice(index, 1);
      }
      this._reRenderStore();
    },

    editCartItem: function(index) {
      const item = cart[index];
      if (!item || !item.isCustom) return;
      this.openCustomModal(item.category, item.id, index);
    },
    
    _reRenderStore: function() {
      renderProductsGrid();
      const container = document.getElementById('cartItems'), countEl = document.getElementById('cartCount'), totalEl = document.getElementById('totalPrice'), floatingBadge = document.getElementById('floatingCartBadge');
      
      let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      let totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      
      countEl.innerText = `(${totalQty} item${totalQty === 1 ? '' : 's'})`;
      if (floatingBadge) floatingBadge.innerText = totalQty;

      if (cart.length === 0) {
        container.innerHTML = `<p class="empty-cart-msg">Your basket is empty.</p>`; 
        totalEl.innerText = '0 Kip';
      } else {
        container.innerHTML = cart.map((item, idx) => {
          const editBtnHtml = item.isCustom ? `<button class="cart-item-edit-btn" onclick="App.editCartItem(${idx})" aria-label="Edit options">✎ Edit Choices</button>` : '';
          
          return `
            <div class="cart-item">
              <div class="cart-item-details">
                <div class="cart-item-name">${item.name}</div>
                ${item.subtext ? `<div class="cart-item-sub">${item.subtext}</div>` : ''}
                ${editBtnHtml}
              </div>
              <div class="cart-item-right">
                <span class="cart-item-price">${formatKip(item.price * item.qty)}</span>
                <div class="cart-stepper">
                  <button class="cart-stepper-btn minus" onclick="App.decrementCartItem(${idx})" aria-label="Decrease quantity">−</button>
                  <span class="cart-stepper-count">${item.qty}</span>
                  <button class="cart-stepper-btn" onclick="App.incrementCartItem(${idx})" aria-label="Increase quantity">+</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
        totalEl.innerText = formatKip(totalPrice);
      }
    },

    openCustomModal: function(catKey, itemId, editIndex = null) {
      const item = menuData[catKey].find(i => i.id === itemId);
      if (!item) return;

      editingCartIndex = editIndex;
      currentActiveCustomItem = { ...item, category: catKey };
      
      const modalTitleEl = document.getElementById('modalTitle');
      const submitBtnEl = document.getElementById('customModalSubmitBtn');
      
      if (editingCartIndex !== null) {
        modalTitleEl.innerText = `Edit: ${item.name}`;
        submitBtnEl.innerText = "Save Changes";
      } else {
        modalTitleEl.innerText = item.name;
        submitBtnEl.innerText = "Add to Order";
      }

      const bldBox = document.getElementById('standardBuilderBox'), welBox = document.getElementById('wellnessChoiceBox');

      bldBox.style.display = 'block';
      if (item.needsWellnessChoice) {
        welBox.style.display = 'block';
        document.getElementById('wellnessContainer').innerHTML = commonChoices.wellnessDrinks.map((drink, idx) => `<label class="option-label"><input type="radio" name="custWellness" value="${drink}" ${idx === 0 ? 'checked' : ''}> ${drink}</label>`).join('');
      } else welBox.style.display = 'none';

      document.getElementById('modalRulesInfo').innerText = `Included: Up to ${item.maxSauces} Sauce(s), ${item.maxVeggies} Veggie(s), and ${item.maxProteins} Protein(s).\n(Extra Veggies or Proteins: +7,000 Kip each)`;
      
      const genChoices = (arr, name) => arr.map(val => `<label class="option-label"><input type="checkbox" name="${name}" value="${val}" onchange="App.enforceLimit(this, '${name}', currentActiveCustomItem.max${name.replace('cust', '')}s)"> ${val}</label>`).join('');
      document.getElementById('saucesContainer').innerHTML = genChoices(commonChoices.sauces, 'custSauce');
      document.getElementById('veggiesContainer').innerHTML = genChoices(commonChoices.veggies, 'custVeggie');
      document.getElementById('proteinsContainer').innerHTML = genChoices(item.specificProteins ? commonChoices[item.specificProteins] : commonChoices.proteins, 'custProtein');
      
      if (editingCartIndex !== null) {
        const existingItem = cart[editingCartIndex];
        if (existingItem && existingItem.subtext) {
          const parts = existingItem.subtext.split(' | ');
          parts.forEach(part => {
            if (part.startsWith('Drink: ')) {
              const drinkVal = part.replace('Drink: ', '').trim();
              const radio = document.querySelector(`input[name="custWellness"][value="${drinkVal}"]`);
              if (radio) radio.checked = true;
            } else if (part.startsWith('Sauces: ')) {
              const saucesArr = part.replace('Sauces: ', '').split(', ').map(s => s.trim());
              saucesArr.forEach(s => {
                const cb = document.querySelector(`input[name="custSauce"][value="${s}"]`);
                if (cb) cb.checked = true;
              });
            } else if (part.startsWith('Veggies: ')) {
              const vegArr = part.replace('Veggies: ', '').split(', ').map(s => s.trim());
              vegArr.forEach(v => {
                const cb = document.querySelector(`input[name="custVeggie"][value="${v}"]`);
                if (cb) cb.checked = true;
              });
            } else if (part.startsWith('Proteins: ')) {
              const protArr = part.replace('Proteins: ', '').split(', ').map(p => p.trim());
              protArr.forEach(p => {
                const cb = document.querySelector(`input[name="custProtein"][value="${p}"]`);
                if (cb) cb.checked = true;
              });
            }
          });
        }
      }

      const modal = document.getElementById('customModal');
      setScrollLock(true);
      modal.classList.add('active');
      trapFocus(modal);
    },

    closeCustomModal: function() { 
      document.getElementById('customModal').classList.remove('active'); 
      setScrollLock(false);
      currentActiveCustomItem = null; 
      editingCartIndex = null;
    },
    
    // -- Image Gallery & Direct Order Logic --
    openGallery: function(catKey, itemId) {
      const item = menuData[catKey].find(i => i.id === itemId);
      if (!item) return;
      
      document.getElementById('galleryTitle').innerText = item.name;
      document.getElementById('galleryDesc').innerText = item.desc;
      document.getElementById('galleryPriceTag').innerText = formatKip(item.price);
      
      const actionContainer = document.getElementById('galleryActionContainer');
      if (item.isCustom) {
        actionContainer.innerHTML = `<button class="add-btn" onclick="App.closeGallery(); App.openCustomModal('${catKey}', '${item.id}')">Customize Item</button>`;
      } else {
        actionContainer.innerHTML = `<button class="add-btn" onclick="App.addMenuItemToCart('${catKey}', '${item.id}', this); App.closeGallery();">Add to Cart +</button>`;
      }

      const imageList = item.images && item.images.length > 0 ? item.images : defaultDummyImages;
      setupCarousel('galleryCarouselTrack', 'galleryCarouselDots', imageList);
      
      const modal = document.getElementById('galleryModal');
      setScrollLock(true);
      modal.classList.add('active');
      trapFocus(modal);
    },
    closeGallery: function() { 
      document.getElementById('galleryModal').classList.remove('active'); 
      setScrollLock(false);
      if(carouselIntervals['galleryCarouselTrack']) clearInterval(carouselIntervals['galleryCarouselTrack']);
    },
    
    enforceLimit: function(checkbox, groupName, maxAllowed) {
      if (groupName === 'custSauce') {
        if (document.querySelectorAll(`input[name="${groupName}"]:checked`).length > maxAllowed) {
          checkbox.checked = false;
          this.triggerAlert(`Limit reached! You can select up to ${maxAllowed} Sauce(s) for this section.`, 'Limit Reached');
        }
      }
    },

    addCustomItemToCart: async function(eventElement) {
      if (!currentActiveCustomItem) return;

      const getVals = (name) => Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(cb => cb.value);
      const sauces = getVals('custSauce'), veggies = getVals('custVeggie'), proteins = getVals('custProtein');
      const maxS = currentActiveCustomItem.maxSauces, maxV = currentActiveCustomItem.maxVeggies, maxP = currentActiveCustomItem.maxProteins;

      if (!sauces.length && !veggies.length && !proteins.length) return this.triggerAlert("Please select at least one item to build your option.", "Selection Required");

      const extV = Math.max(0, veggies.length - maxV), extP = Math.max(0, proteins.length - maxP);
      const totExt = extV + extP, totExtCost = totExt * EXTRA_ADDON_PRICE;
      let warnings = [];

      if (sauces.length < maxS || veggies.length < maxV || proteins.length < maxP) {
        let short = [];
        if (sauces.length < maxS) short.push(`Sauces: ${sauces.length} / ${maxS}`);
        if (veggies.length < maxV) short.push(`Veggies: ${veggies.length} / ${maxV}`);
        if (proteins.length < maxP) short.push(`Proteins: ${proteins.length} / ${maxP}`);
        warnings.push(`You still have unused included choices:\n` + short.join('\n'));
      }
      if (totExt > 0) {
        let extra = [];
        if (extV > 0) extra.push(`Extra Veggies: +${extV} (${formatKip(extV * EXTRA_ADDON_PRICE)})`);
        if (extP > 0) extra.push(`Extra Proteins: +${extP} (${formatKip(extP * EXTRA_ADDON_PRICE)})`);
        warnings.push(`Additional Add-ons selected:\n` + extra.join('\n') + `\nTotal Extra: +${formatKip(totExtCost)}`);
      }

      if (warnings.length > 0) {
        const proceed = await new Promise(resolve => this.triggerConfirm(warnings.join('\n\n') + `\n\nAre you sure you want to proceed?`, 'Customize Confirmation', resolve));
        if (!proceed) return;
      }

      let subParts = [];
      if (currentActiveCustomItem.needsWellnessChoice) subParts.push(`Drink: ${document.querySelector('input[name="custWellness"]:checked').value}`);
      if (sauces.length) subParts.push(`Sauces: ${sauces.join(', ')}`);
      if (veggies.length) subParts.push(`Veggies: ${veggies.join(', ')}`);
      if (proteins.length) subParts.push(`Proteins: ${proteins.join(', ')}`);
      if (totExt > 0) subParts.push(`Add-ons: +${totExt} item(s) (+${formatKip(totExtCost)})`);

      const finalSubtext = subParts.join(' | ');
      const finalPrice = currentActiveCustomItem.price + totExtCost;

      if (editingCartIndex !== null && cart[editingCartIndex]) {
        cart[editingCartIndex].subtext = finalSubtext;
        cart[editingCartIndex].price = finalPrice;
      } else {
        const existing = cart.find(c => c.id === currentActiveCustomItem.id && c.subtext === finalSubtext && c.price === finalPrice);
        if (existing) {
          existing.qty += 1;
        } else {
          cart.push({ id: currentActiveCustomItem.id, name: currentActiveCustomItem.name, price: finalPrice, subtext: finalSubtext, qty: 1, isCustom: true, category: currentActiveCustomItem.category });
        }
      }

      animateFlyToCart(eventElement);
      this._reRenderStore(); 
      this.closeCustomModal();
    },

    clearOrderTypeError: function() {
      document.getElementById('orderOptionsBox').classList.remove('error-highlight');
      document.getElementById('orderTypeErrorMsg').style.display = 'none';
    },

    /* --- iOS SAFE REDIRECTS --- */
    checkoutWA: function() {
      const msg = this._buildOrderMsg();
      if (!msg) return;
      
      const url = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(msg)}`;
      
      this.triggerConfirm(
        "Your order details have been successfully prepared.\n\nTap 'Open App' below to send it via WhatsApp.", 
        "Order Ready! 📋", 
        (proceed) => { }, 
        url
      );
    },

    checkoutMessenger: function() {
      const msg = this._buildOrderMsg();
      if (!msg) return;

      const url = `https://m.me/${MESSENGER_USERNAME}`;

      const proceedToMessenger = () => {
        this.triggerConfirm(
          "Your order details have been successfully prepared.\n\nWhen Messenger opens, paste your order text into the chat to send.", 
          "Order Ready! 📋", 
          (proceed) => { }, 
          url
        );
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(msg).then(() => {
          proceedToMessenger();
        }).catch(() => {
          this._fallbackCopyText(msg);
          proceedToMessenger();
        });
      } else {
        this._fallbackCopyText(msg);
        proceedToMessenger();
      }
    },

    _fallbackCopyText: function(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      textArea.style.top = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try { document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(textArea);
    },

    _buildOrderMsg: function() {
      if (cart.length === 0) { this.triggerAlert("Your basket is empty! Please add items before ordering.", "Empty Basket"); return null; }
      const type = document.querySelector('input[name="orderType"]:checked');
      if (!type) {
        document.getElementById('orderOptionsBox').classList.add('error-highlight'); document.getElementById('orderTypeErrorMsg').style.display = 'block';
        document.getElementById('orderOptionsBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
        this.triggerAlert("⚠️ Please select either Dine-In or Pick-Up before submitting your order!", "Action Required"); return null;
      }
      let msg = `✦ *OON JAI ORDER* ✦\n*Type: ${type.value}*\n\n*Items Ordered:*\n`;
      cart.forEach((item, index) => { 
        msg += `${index + 1}. *${item.name}* (x${item.qty}) - ${formatKip(item.price * item.qty)}\n` + (item.subtext ? `   _${item.subtext}_\n` : ''); 
      });
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      msg += `\n*Total: ${formatKip(totalPrice)}*\n\n👉Note: Please send your payment receipt to process this order.\n`;
      return msg;
    },

    triggerAlert: function(message, title) {
      document.getElementById('notifTitle').innerText = title; 
      document.getElementById('notifMessage').innerText = message;
      document.getElementById('notifAlertAction').style.display = 'block'; 
      document.getElementById('notifConfirmActions').style.display = 'none';
      const m = document.getElementById('notificationModal'); 
      setScrollLock(true);
      m.classList.add('active'); 
      trapFocus(m);
    },
    
    triggerConfirm: function(message, title, callback, redirectUrl = null) {
      document.getElementById('notifTitle').innerText = title; 
      document.getElementById('notifMessage').innerText = message;
      document.getElementById('notifAlertAction').style.display = 'none'; 
      document.getElementById('notifConfirmActions').style.display = 'flex';
      
      const m = document.getElementById('notificationModal'); 
      setScrollLock(true);
      m.classList.add('active'); 
      trapFocus(m);
      
      const btnProceedContainer = document.getElementById('btnNotifProceed').parentNode;
      const oldBtn = document.getElementById('btnNotifProceed');
      
      // Clone the button to wipe out old event listeners so they don't stack
      const btnProceed = oldBtn.cloneNode(true);
      btnProceedContainer.replaceChild(btnProceed, oldBtn);
      
      if (redirectUrl) {
        btnProceed.innerText = "Open App";
        btnProceed.href = redirectUrl; 
        
        btnProceed.onclick = (e) => { 
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
          
          if (isIOS) {
            // ADVANCED IOS FALLBACK: Secretly trigger raw URI scheme while standard link fires
            if (redirectUrl.includes('m.me/')) {
              const username = redirectUrl.split('m.me/')[1];
              setTimeout(() => { window.location.href = `fb-messenger://user-thread/${username}`; }, 50);
            } else if (redirectUrl.includes('wa.me/')) {
              const query = redirectUrl.split('wa.me/')[1];
              setTimeout(() => { window.location.href = `whatsapp://send?phone=${query.replace('?text=', '&text=')}`; }, 50);
            }
          }
          
          // Delay closing the modal by 1.5s. If we close it instantly, Safari cancels the deep link!
          setTimeout(() => {
            this.closeNotification(); 
            if(callback) callback(true);
          }, 1500); 
        };
      } else {
        btnProceed.innerText = "Proceed";
        btnProceed.href = "javascript:void(0)";
        btnProceed.onclick = (e) => { 
          e.preventDefault();
          this.closeNotification(); 
          if(callback) callback(true); 
        };
      }
      
      document.getElementById('btnNotifCancel').onclick = () => { 
        this.closeNotification(); 
        if(callback) callback(false); 
      };
    },
    
    closeNotification: function() { 
      document.getElementById('notificationModal').classList.remove('active'); 
      setScrollLock(false);
    }
  };
})();
</script>
